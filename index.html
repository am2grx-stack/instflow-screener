<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>INSTFLOW Screener</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #050d18; font-family: 'Courier New', monospace; color: #c8d8e8; min-height: 100vh; }
  header { padding: 20px 24px; border-bottom: 1px solid #0d1e30; display: flex; align-items: baseline; gap: 12px; }
  h1 { font-size: 22px; color: #fff; }
  h1 span { color: #00ff8c; }
  .sub { font-size: 9px; color: #445566; letter-spacing: 3px; }
  .container { display: flex; min-height: calc(100vh - 61px); }
  .sidebar { width: 220px; background: #070f1c; border-right: 1px solid #0d1e30; padding: 20px 16px; flex-shrink: 0; }
  .label { font-size: 9px; color: #8899aa; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 6px; display: block; }
  select, input[type=range] { width: 100%; margin-bottom: 14px; }
  select { background: #0a1525; border: 1px solid #1a2535; color: #c8d8e8; padding: 6px; border-radius: 4px; font-family: inherit; font-size: 10px; }
  input[type=range] { accent-color: #00ff8c; }
  .val { color: #00ff8c; font-size: 11px; float: right; }
  .main { flex: 1; overflow-x: auto; }
  .sort-bar { padding: 12px 20px; border-bottom: 1px solid #0d1e30; background: #060e1a; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .sort-bar span { font-size: 9px; color: #445566; letter-spacing: 1px; }
  button.sort { background: none; border: 1px solid #1a2a3a; color: #8899aa; padding: 4px 10px; border-radius: 4px; font-family: inherit; font-size: 9px; letter-spacing: 1px; cursor: pointer; text-transform: uppercase; }
  button.sort.active, button.sort:hover { border-color: #00ff8c; color: #00ff8c; background: rgba(0,255,140,0.06); }
  table { width: 100%; border-collapse: collapse; }
  thead td { font-size: 8px; color: #445566; letter-spacing: 1px; text-transform: uppercase; padding: 8px 20px; border-bottom: 1px solid #0d1e30; }
  tbody tr { border-bottom: 1px solid #0a1825; cursor: pointer; transition: background 0.15s; }
  tbody tr:hover { background: rgba(0,255,140,0.04); }
  tbody td { padding: 10px 20px; font-size: 11px; }
  .ticker { font-size: 13px; font-weight: 600; color: #e8f0f8; }
  .name { font-size: 9px; color: #8899aa; }
  .green { color: #00ff8c; }
  .yellow { color: #ffc800; }
  .red { color: #ff3232; }
  .badge { display: inline-block; border-radius: 3px; padding: 2px 6px; font-size: 8px; letter-spacing: 0.5px; }
  .badge.strong { background: rgba(0,255,140,0.12); border: 1px solid #00ff8c; color: #00ff8c; }
  .badge.medium { background: rgba(255,200,0,0.10); border: 1px solid #ffc800; color: #ffc800; }
  .badge.caution { background: rgba(255,120,0,0.10); border: 1px solid #ff7800; color: #ff7800; }
  .badge.weak { background: rgba(255,50,50,0.08); border: 1px solid #ff3232; color: #ff3232; }
  .loading { padding: 60px; text-align: center; color: #445566; letter-spacing: 2px; font-size: 11px; }
  .count { font-size: 28px; font-weight: 600; color: #00ff8c; margin-top: 16px; }
  .count-label { font-size: 8px; color: #445566; margin-top: 2px; }
  footer { padding: 8px 24px; border-top: 1px solid #0d1e30; background: #060e1a; font-size: 8px; color: #2a3a4a; letter-spacing: 1px; }
  ::-webkit-scrollbar { width: 4px; height: 4px; }
  ::-webkit-scrollbar-track { background: #0a1525; }
  ::-webkit-scrollbar-thumb { background: #1e3050; border-radius: 2px; }
</style>
</head>
<body>

<header>
  <h1>INST<span>FLOW</span></h1>
  <span class="sub">SCREENER · YAHOO FINANCE</span>
</header>

<div class="container">
  <div class="sidebar">
    <div style="font-size:9px;color:#00ff8c;letter-spacing:2px;margin-bottom:16px">▸ FILTROS</div>

    <span class="label">Sector</span>
    <select id="sector">
      <option value="">Todos</option>
      <option value="Technology">Technology</option>
      <option value="Energy">Energy</option>
      <option value="Financial Services">Financials</option>
      <option value="Healthcare">Healthcare</option>
      <option value="Industrials">Industrials</option>
      <option value="Utilities">Utilities</option>
      <option value="Basic Materials">Materials</option>
      <option value="Consumer Cyclical">Consumer Disc.</option>
    </select>

    <span class="label">Perf. Anual mín. <span class="val" id="v-perf">20%</span></span>
    <input type="range" id="perf" min="0" max="200" value="20">

    <span class="label">RSI mín. <span class="val" id="v-rsiMin">40</span></span>
    <input type="range" id="rsiMin" min="20" max="70" value="40">

    <span class="label">RSI máx. <span class="val" id="v-rsiMax">75</span></span>
    <input type="range" id="rsiMax" min="50" max="90" value="75">

    <div style="border-top:1px solid #0d1e30;padding-top:14px;margin-top:4px">
      <div class="count" id="count">—</div>
      <div class="count-label">RESULTADOS</div>
    </div>

    <button onclick="window.loadData()" style="width:100%;margin-top:14px;padding:8px 0;background:rgba(0,255,140,0.08);border:1px solid #00ff8c;color:#00ff8c;border-radius:4px;font-size:9px;letter-spacing:1px;cursor:pointer;font-family:inherit">
      ↺ ACTUALIZAR
    </button>
  </div>

  <div class="main">
    <div class="sort-bar">
      <span>ORDENAR:</span>
      <button class="sort active" onclick="sortTable('perf52w', event)">Perf. 52 sem.</button>
      <button class="sort" onclick="sortTable('rsi', event)">RSI</button>
      <button class="sort" onclick="sortTable('marketCap', event)">Market Cap</button>
      <button class="sort" onclick="sortTable('change', event)">Cambio hoy</button>
    </div>
    <div id="output" class="loading">CARGANDO DATOS...</div>
  </div>
</div>

<footer>DATOS: YAHOO FINANCE · SOLO FINES EDUCATIVOS · NO ES ASESORAMIENTO FINANCIERO</footer>

<script>
const TICKERS = [
  'NVDA','PLTR','CEG','GEV','VST','APP','HWM','TPL',
  'AAPL','MSFT','AMZN','META','GOOGL','AMD','AVGO',
  'XOM','CVX','LLY','UNH','JPM','GS','BAC','V','MA'
];

let allStocks = [];
let currentSort = 'perf52w';

async function fetchStock(ticker) {
  try {
    const url = `https://api.allorigins.win/get?disableCache=true&url=${encodeURIComponent(`https://query1.finance.yahoo.com/v8/finance/chart/${ticker}?interval=1d&range=1y`)}`;
    const res = await fetch(url);
    const data = await res.json();
    const parsed = JSON.parse(data.contents);
    const meta = parsed.chart.result[0].meta;
    const closes = parsed.chart.result[0].indicators.quote[0].close.filter(Boolean);
    const firstClose = closes[0];
    const lastClose = closes[closes.length - 1];
    const perf52w = ((lastClose - firstClose) / firstClose) * 100;
    const change = ((meta.regularMarketPrice - meta.chartPreviousClose) / meta.chartPreviousClose) * 100;

    // RSI calculado con últimos 14 días
    const rsi = calcRSI(closes.slice(-15));

    return {
      ticker,
      name: meta.longName || ticker,
      sector: meta.sector || '—',
      price: meta.regularMarketPrice,
      change,
      perf52w,
      marketCap: meta.marketCap || 0,
      rsi,
    };
  } catch {
    return null;
  }
}

function calcRSI(closes) {
  if (closes.length < 15) return 50;
  let gains = 0, losses = 0;
  for (let i = 1; i < closes.length; i++) {
    const diff = closes[i] - closes[i - 1];
    if (diff > 0) gains += diff;
    else losses += Math.abs(diff);
  }
  const avg_gain = gains / 14;
  const avg_loss = losses / 14;
  if (avg_loss === 0) return 100;
  const rs = avg_gain / avg_loss;
  return Math.round(100 - (100 / (1 + rs)));
}

function getSignal(s) {
  const perfOk = s.perf52w > 20;
  const rsiOk = s.rsi >= 40 && s.rsi <= 75;
  const changeOk = s.change > 0;
  const score = [perfOk, rsiOk, changeOk].filter(Boolean).length;
  if (score === 3) return 'strong';
  if (score === 2) return 'medium';
  if (score === 1) return 'caution';
  return 'weak';
}

function getSignalLabel(s) {
  return { strong: 'FUERTE', medium: 'MEDIO', caution: 'EXTENDIDA', weak: 'DÉBIL' }[s];
}

function formatCap(n) {
  if (!n) return '—';
  if (n >= 1e12) return `$${(n / 1e12).toFixed(1)}T`;
  if (n >= 1e9) return `$${(n / 1e9).toFixed(1)}B`;
  return `$${(n / 1e6).toFixed(0)}M`;
}

function colorPerf(p) {
  if (p > 50) return 'green';
  if (p > 20) return 'yellow';
  if (p > 0) return '';
  return 'red';
}

function applyFilters() {
  const sector = document.getElementById('sector').value;
  const perf = +document.getElementById('perf').value;
  const rsiMin = +document.getElementById('rsiMin').value;
  const rsiMax = +document.getElementById('rsiMax').value;

  return allStocks.filter(s => {
    if (sector && s.sector !== sector) return false;
    if (s.perf52w < perf) return false;
    if (s.rsi < rsiMin || s.rsi > rsiMax) return false;
    return true;
  }).sort((a, b) => b[currentSort] - a[currentSort]);
}

function render() {
  const stocks = applyFilters();
  document.getElementById('count').textContent = stocks.length;

  if (stocks.length === 0) {
    document.getElementById('output').innerHTML = '<div class="loading">SIN RESULTADOS — AJUSTA LOS FILTROS</div>';
    return;
  }

  document.getElementById('output').innerHTML = `
    <table>
      <thead>
        <tr>
          <td>Ticker</td>
          <td>Nombre</td>
          <td style="text-align:right">Precio</td>
          <td style="text-align:right">Hoy</td>
          <td style="text-align:right">52 sem.</td>
          <td style="text-align:right">RSI</td>
          <td style="text-align:right">Market Cap</td>
          <td>Señal</td>
        </tr>
      </thead>
      <tbody>
        ${stocks.map(s => {
          const sig = getSignal(s);
          return `
          <tr>
            <td class="ticker">${s.ticker}</td>
            <td class="name">${s.name}</td>
            <td style="text-align:right">$${s.price?.toFixed(2)}</td>
            <td style="text-align:right" class="${s.change > 0 ? 'green' : 'red'}">
              ${s.change > 0 ? '+' : ''}${s.change?.toFixed(2)}%
            </td>
            <td style="text-align:right" class="${colorPerf(s.perf52w)}">
              ${s.perf52w > 0 ? '+' : ''}${s.perf52w?.toFixed(1)}%
            </td>
            <td style="text-align:right;color:${s.rsi > 70 ? '#ff7800' : '#c8d8e8'}">${s.rsi}</td>
            <td style="text-align:right;color:#556677">${formatCap(s.marketCap)}</td>
            <td><span class="badge ${sig}">${getSignalLabel(sig)}</span></td>
          </tr>`;
        }).join('')}
      </tbody>
    </table>
  `;
}

function sortTable(key, e) {
  currentSort = key;
  document.querySelectorAll('.sort').forEach(b => b.classList.remove('active'));
  e.target.classList.add('active');
  render();
}

async function loadData() {   document.getElementById('output').innerHTML = '<div class="loading">CARGANDO DATOS...</div>';   document.getElementById('count').textContent = '—';   allStocks = [];    const grupos = [];   for (let i = 0; i < TICKERS.length; i += 4) {     grupos.push(TICKERS.slice(i, i + 4));   }    for (const grupo of grupos) {     const results = await Promise.all(grupo.map(fetchStock));     const validos = results.filter(Boolean);     allStocks = allStocks.concat(validos);     render();     await new Promise(function(r) { setTimeout(r, 1500); });   } }  window.loadData = loadData;   document.getElementById('output').innerHTML = '<div class="loading">CARGANDO DATOS...</div>';   document.getElementById('count').textContent = '—';   allStocks = [];    const grupos = [];   for (let i = 0; i < TICKERS.length; i += 4) {     grupos.push(TICKERS.slice(i, i + 4));   }    for (const grupo of grupos) {     const results = await Promise.all(grupo.map(fetchStock));     const validos = results.filter(Boolean);     allStocks = [...allStocks, ...validos];     render();     await new Promise(r => setTimeout(r, 1500));   } }
  document.getElementById('output').innerHTML = '<div class="loading">CARGANDO DATOS REALES...</div>';
  document.getElementById('count').textContent = '—';
  const results = await Promise.all(TICKERS.map(fetchStock));
  allStocks = results.filter(Boolean);
  render();
}

['sector','perf','rsiMin','rsiMax'].forEach(id => {
  document.getElementById(id).addEventListener('input', e => {
    const units = { perf: '%' };
    const el = document.getElementById('v-' + id);
    if (el) el.textContent = e.target.value + (units[id] || '');
    render();
  });
});

loadData();
</script>
</body>
</html>
